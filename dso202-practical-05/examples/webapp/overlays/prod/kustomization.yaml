apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-prod
resources:
- ../../base
- namespace.yaml
replicas:
- name: webapp
  count: 3
labels:
- pairs:
    environment: prod
  includeSelectors: true
  includeTemplates: true
configMapGenerator:
- name: web-content
  behavior: replace
  files:
  - index.html
patches:
- path: patch-resources.yaml
images:
- name: nginx
  newName: nginx
  newTag: 1.27-alpine
