apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-staging
resources:
- ../../base
- namespace.yaml
replicas:
- name: webapp
  count: 2
labels:
- pairs:
    environment: staging
  includeSelectors: true
  includeTemplates: true
configMapGenerator:
- name: web-content
  behavior: replace
  files:
  - index.html
images:
- name: nginx
  newName: nginx
  newTag: 1.27-alpine
