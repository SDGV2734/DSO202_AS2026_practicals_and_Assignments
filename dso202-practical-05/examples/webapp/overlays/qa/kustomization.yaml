apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-qa
resources:
- ../../base
- namespace.yaml
replicas:
- name: webapp
  count: 2
labels:
- pairs:
    environment: qa
  includeSelectors: true
  includeTemplates: true
configMapGenerator:
- name: web-content
  behavior: replace
  files:
  - index.html
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: webapp
  path: patch-annotation.yaml
