apiVersion: v1
kind: Namespace
metadata:
  name: webapp-sandbox
---
apiVersion: v1
data:
  index.html: |
    <html><body><h1>BASE webapp</h1></body></html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: kustomize-webapp
  name: sandbox-web-content-8f5fdb69k4
  namespace: webapp-sandbox
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: kustomize-webapp
  name: sandbox-webapp
  namespace: webapp-sandbox
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: kustomize-webapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: kustomize-webapp
  name: sandbox-webapp
  namespace: webapp-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/part-of: kustomize-webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp
        app.kubernetes.io/part-of: kustomize-webapp
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: webapp
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html/index.html
          name: web-content
          subPath: index.html
      volumes:
      - configMap:
          name: sandbox-web-content-8f5fdb69k4
        name: web-content
