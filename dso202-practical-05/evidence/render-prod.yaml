apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: prod
  name: webapp-prod
---
apiVersion: v1
data:
  index.html: |
    <html><body><h1>PRODUCTION environment</h1></body></html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: kustomize-webapp
    environment: prod
  name: web-content-5656885575
  namespace: webapp-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: kustomize-webapp
    environment: prod
  name: webapp
  namespace: webapp-prod
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: kustomize-webapp
    environment: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: kustomize-webapp
    environment: prod
  name: webapp
  namespace: webapp-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/part-of: kustomize-webapp
      environment: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp
        app.kubernetes.io/part-of: kustomize-webapp
        environment: prod
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: webapp
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html/index.html
          name: web-content
          subPath: index.html
      volumes:
      - configMap:
          name: web-content-5656885575
        name: web-content
