    port: 80
    targetPort: http
    protocol: TCP
    nodePort: 30080

---
# Source: webapp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-dev
  labels:
    helm.sh/chart: webapp-0.1.0
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp-dev
    app.kubernetes.io/version: "1.30-alpine"
    app.kubernetes.io/managed-by: Helm
    dso202/environment: "dev"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/instance: webapp-dev
  template:
    metadata:
      labels:
        helm.sh/chart: webapp-0.1.0
        app.kubernetes.io/name: webapp
        app.kubernetes.io/instance: webapp-dev
        app.kubernetes.io/version: "1.30-alpine"
        app.kubernetes.io/managed-by: Helm
        dso202/environment: "dev"
      annotations:
        checksum/config: 1e73a2071f8e5daea7828e3c1f9cd1403c9941973d71363b5a4ab5d321e84866
    spec:
      containers:
      - name: nginx
        image: "nginx:1.30-alpine"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
      volumes:
      - name: html
        configMap:
          name: webapp-dev
---
# Source: webapp/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: webapp-dev-test-connection
  labels:
    helm.sh/chart: webapp-0.1.0
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp-dev
    app.kubernetes.io/version: "1.30-alpine"
    app.kubernetes.io/managed-by: Helm
    dso202/environment: "dev"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
  - name: wget
    image: busybox:1.37
    command:
    - sh
    - -c
    - 'wget -qO- http://webapp-dev:80 | grep "Environment: dev"'

