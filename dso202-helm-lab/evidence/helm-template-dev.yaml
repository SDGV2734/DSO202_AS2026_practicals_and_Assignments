---
# Source: webapp/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: webapp-dev
  labels:
    helm.sh/chart: webapp-0.1.0
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp-dev
    app.kubernetes.io/version: "1.30-alpine"
    app.kubernetes.io/managed-by: Helm
    dso202/environment: "dev"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp-dev
  ports:
